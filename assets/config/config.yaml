schema: agile-pm

context: |
  Discover the product, its users, and its current direction from repository
  documentation, approved product records, active changes, and the implementation.
  Treat repository-specific instruction files as authoritative constraints for
  the surfaces they govern. Validate current behavior before relying on summaries.
  Preserve human judgement and approval points. Treat safety, auditability,
  interoperability, compatibility, privacy, security, migration, and operational
  resilience as relevant constraints when the proposed capability touches them.
  For delivery planning, use small end-to-end spirals that produce user or
  operational feedback. For open-ended PRD shaping, follow the installed
  agile-pm workflows/product-shaping.md contract and maintain a saved draft
  without requiring a delivery increment or entering engineering planning.
  Agile-pm is human-led and iterative: ask focused questions until the vision,
  desired outcome, and boundaries are understood. Clarify the current capability
  increment when the human chooses delivery planning.
  Artifact dependencies preserve coherence but do not create irreversible phases;
  learning may flow back into the PRD set with renewed approval.
  PM prepares the cumulative product pages; approval authorizes their exact set;
  delivery reconciles findings with renewed approval; archive publishes the reviewed
  overview, capabilities, system capabilities, and MkDocs navigation.

rules:
  product-brief:
    - Honor explicit product-shaping intent using workflows/product-shaping.md; saved drafts remain outside the delivery graph until an explicit scoping handoff.
    - Honor requirements elicitation and quality-review intent using workflows/requirements-analysis.md; revise candidates and findings in the same unapproved draft without selecting an increment or starting delivery artifacts.
    - Separate known evidence, assumptions, and unknowns.
    - Compare alternatives, including doing nothing, before recommending work.
    - Ask the human focused, adaptive questions and confirm the brief represents their intent.
  prd:
    - Keep Must scope to the smallest increment that can validate the hypothesis.
    - Never claim customer evidence or quantitative baselines that are not documented.
    - Keep detailed requirements in the indexed capability PRDs, not in prd.md.
    - Index each increment capability's user/system kind and proposed product page without changing existing requirement identities.
    - Develop the hypothesis, outcomes, boundaries, feedback loop, and capability index iteratively with the human.
  prd-capabilities:
    - Keep the prd.md index and prd/capabilities/**/*.md files exhaustive and exact.
    - Use capability-qualified references in the form <change-name>#<capability-path>/FR-001.
    - Capability PRDs define product intent and priority; OpenSpec specs define normative behavior and test scenarios.
    - Ask rather than guess when requirement intent, priority, acceptance, dependencies, risks, or exclusions are unclear.
    - Follow workflows/user-journeys.md for relevant journey/flow coverage; map product steps to requirements and acceptance outcomes without introducing scope in diagrams.
    - At an explicit draft handoff, use workflows/requirements-analysis.md to map only human-selected candidates to formal IDs, retaining sources, acceptance intent, shared constraints, and safely deferred questions.
  product-docs:
    - Follow workflows/product-publication.md to prepare a high-level product-docs/prd.md and complete capabilities/ and system-capabilities/ pages before approval.
    - Preserve unaffected requirements and identities; integrate additions, modifications, and retirements and reconcile contradictory boundaries.
    - Reconcile legacy single masters and approved snapshots with the human; never assume the newest increment is the whole product.
    - Put detailed requirements, journeys, flows, and text equivalents in capability/system-capability pages using workflows/user-journeys.md.
  publication-plan:
    - Follow workflows/product-publication.md for product-publication.yaml and staged product-docs/mkdocs.yml; protect every baseline page and the existing config.
    - Preserve site settings and unrelated navigation; review the full mapping, explicit removals, proposed pages, and baseline diff before approval.
  product-approval:
    - Create only after explicit approval of the increment, indexed capability PRDs, complete proposed product-docs set, MkDocs config, and publication plan.
    - Require approval format 3 with PRD-set digest/count, Publication Plan SHA-256, and Base Publication SHA-256 as defined in workflows/product-publication.md.
    - Approval writes only the approval record; publish product pages and MkDocs navigation only during archive after delivery reconciliation.
    - Preserve approved bytes and records in product-history before removing working approval for revisions; leave published pages intact until archive.
    - Review embedded journeys and flows with the PRD set, verify syntax and consistency, and treat later diagram edits as changes requiring reapproval.
  proposal:
    - Reject stale PRD-set approval before creating or updating the proposal.
    - Trace every proposed capability to one or more capability-qualified PRD requirement IDs.
    - Allow skip_specs only when the change-scoped prd.md and indexed capability PRDs contain zero Must requirements; unaffected cumulative requirements do not create new work.
    - Return product ambiguity to the human and PRD set instead of inventing intent during handoff.
  specs:
    - Reject stale PRD-set approval before creating or updating specs.
    - Trace every requirement to one or more capability-qualified PRD requirement IDs.
    - Map every Must requirement in every indexed capability PRD to an OpenSpec requirement.
    - Keep normative behavior and scenarios in specs while preserving the PRD set as product intent.
  design:
    - Reject stale PRD-set approval before creating or updating design.md.
    - Route design discoveries that change product intent or acceptance back through human clarification and PRD-set reapproval.
  tasks:
    - Reject stale PRD-set approval before creating or updating tasks.md.
    - Cover every Must requirement in every indexed capability PRD.
    - Route task-planning discoveries that change product intent or acceptance back through human clarification and PRD-set reapproval.

operations:
  apply:
    guidance:
      - Preserve the PRD scope and human approval points while implementing.
      - Follow workflows/task-review.md and end every task with a mandatory independent agent review, looping fixes until it passes, then prompt the human to accept, review it themselves, or request changes.
      - Mark a task complete only after it has passed agent review and been accepted; the human may waive later prompts but never the agent review.
      - Reject stale PRD-set approval before implementation, including blocked or all-done task states.
      - Run Approved product set preflight from workflows/product-publication.md; require valid approval and a matching full published baseline, not publication of this increment.
      - Reconcile delivery and acceptance changes in the proposed product pages and reapprove when needed; do not publish pages or MkDocs during apply.
      - Capture newly discovered product assumptions for review instead of silently expanding scope.
      - Feed product discoveries back into the PRD set for human clarification and reapproval, reconcile downstream artifacts, then continue the same change when practical.
  archive:
    guidance:
      - For agile-pm changes, every archive guidance entry below is a mandatory completion requirement, not optional advice; stop on missing, conflicting, or inapplicable guidance.
      - Read workflows/product-publication.md and run Approved product set preflight before any spec sync, publication, or archive move.
      - Require format-3 approval of the complete reconciled documentation set and MkDocs config; verify reviewed digest, plan hash, and full published baseline.
      - Publish the exact approved overview, capability/system-capability pages, README, and MkDocs config using the shared locked journaled transaction, then archive the change/history.
      - Preserve historical snapshots, legacy catalog rows, unrelated pages, and unrelated site configuration; remove only explicitly approved retired managed capability pages.
      - Reject stale baselines, rebase with human review and renewed approval, and never overwrite a newer publication from an older approved candidate.
      - Verify publication and archived approval/history before reporting success; roll back on failure and retain recovery evidence when rollback cannot be verified.
