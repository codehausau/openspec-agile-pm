name: agile-pm
version: 5
description: Product shaping, iterative discovery, approval-time master PRD publication, and capability-based delivery
artifacts:
  - id: product-brief
    generates: product-brief.md
    description: Product discovery brief for the smallest useful learning loop
    template: product-brief.md
    instruction: |
      If the human wants open-ended brainstorming with a saved PRD rather than a
      delivery increment, follow workflows/product-shaping.md in this installed
      schema bundle and stop the delivery artifact workflow. That client-neutral
      mode saves a draft outside the change graph and requires no product brief,
      capability decomposition, or technical planning. Resume this artifact only
      after an explicit transition into delivery scoping. A source draft is evidence,
      not approved scope; record its path/hash and confirm the selected increment.

      Act as a pragmatic product manager and turn the initial idea into a concise
      product brief. Ground it in repository evidence and existing product
      documents, starting with <planningHome.root>/docs/product/prd.md when present.
      The master describes current approved intent, not proof of delivery. Clearly
      separate facts from assumptions; never invent customer
      research, demand, metrics, or commitments.

      Begin with a lightweight conversation about the human's vision or the thing
      being built. Reflect back your understanding and ask focused, high-leverage
      questions wherever the intended user, problem, outcome, context, constraints,
      trade-offs, or acceptable first increment are unclear. Ask no more than three
      questions at a time, adapt follow-ups to the answers, and do not force a fixed
      questionnaire. The goal is shared understanding, not completion of a phase.

      Explore alternatives before converging. Optimize for the smallest useful
      spiral that can produce feedback, not a complete long-range solution. If
      the target user, problem, desired outcome, or acceptable scope is materially
      unclear, ask the user rather than silently choosing.

      End with an explicit pursue, research, or park recommendation. A research
      or park recommendation intentionally stops this change before the PRD; do
      not create downstream artifacts unless the user later changes the decision
      to pursue. Keep the brief to roughly one page. This is discovery, not a
      technical design. Before treating the brief as complete, show the human the
      proposed problem, outcome, smallest spiral, assumptions, and recommendation;
      revise until it represents what they want.
    requires: []

  - id: prd
    generates: prd.md
    description: Change-scoped product increment and capability PRD index
    template: prd.md
    instruction: |
      Create the change-scoped lean PRD from the approved product brief and current
      master at <planningHome.root>/docs/product/prd.md, if present. Define the
      overall hypothesis, outcomes, smallest testable increment, feedback loop,
      and product boundaries. Keep detailed requirements out of this file.
      Write in clear product language for project users and stakeholders. This
      increment is an engineering input; master-prd will integrate it into the full
      product document before approval. Exclude secrets, transient internal notes,
      and implementation detail that does not help readers understand product intent.
      Include only capabilities affected by this increment in the index; do not
      turn requirements carried forward in the master into new implementation work.

      Create this artifact only when the product brief recommends pursue and the
      user has explicitly agreed to proceed. For research or park, stop and leave
      the PRD absent. If the user chooses pursue after further discovery, update
      the brief first so it records that decision.

      Re-engage the human while shaping the PRD. Confirm the product hypothesis,
      outcomes, boundaries, feedback loop, and capability decomposition rather
      than inferring agreement from the brief. Ask focused questions when a choice
      would materially affect product intent, priority, safety, compatibility, or
      acceptance. Offer a small number of concrete alternatives when that helps;
      do not run a fixed questionnaire or prescribe a complete long-range plan.

      Define an exhaustive Capability PRD Index. Each capability path is relative
      to prd/capabilities/, omits the .md suffix, and uses lowercase kebab-case
      path segments. Index at least one capability. Every indexed entry will be
      detailed in prd/capabilities/<capability-path>.md by the prd-capabilities
      artifact. Do not confuse these product capability documents with OpenSpec
      specs: capability PRDs define product intent and priority; specs later
      define normative behavior and test scenarios.

      Include measurable success signals where evidence supports them. Label an
      unvalidated target as an assumption instead of presenting it as fact.
      Resolve any open decision that would materially change scope or acceptance
      before completing the PRD; ask the user when needed. Do not turn possible
      later spirals into current scope. Treat the PRD set as an evolving product
      model: review drafts with the human and revise them iteratively until they
      accurately express the current capability increment.
    requires:
      - product-brief

  - id: prd-capabilities
    generates: "prd/capabilities/**/*.md"
    description: Detailed product requirements organized by capability
    template: prd-capability.md
    instruction: |
      Create exactly one capability PRD for every entry in prd.md's Capability
      PRD Index at prd/capabilities/<capability-path>.md. The index and files on
      disk must match exactly: no missing, duplicate, or unindexed capability
      documents. Preserve the indexed path and priority.

      Each capability PRD defines product intent and priority, not an OpenSpec
      normative behavior contract or implementation design. Include its purpose,
      user outcome, in-scope behavior, functional and non-functional requirements,
      product-level acceptance outcomes, dependencies, risks, and exclusions.
      Record assumptions and any open decisions that are safe to defer without
      changing current scope or acceptance.

      When journeys or flows are relevant, follow workflows/user-journeys.md in this
      installed schema. Identify the capability requirements and acceptance outcomes
      supporting consequential product steps and branches. The canonical tables and
      Mermaid source belong in master-prd.md; add references once it is prepared.
      If mapping exposes missing behavior, clarify it with the human rather than
      letting a diagram introduce scope absent from the change-scoped requirements.

      Write each document as user-facing product documentation that remains useful
      after delivery. Explain product behavior and boundaries in plain language,
      avoid repository-internal shorthand, and never include secrets. OpenSpec
      specs remain the separate source for normative behavior and test scenarios.

      Requirement IDs are local to the capability: FR-001, FR-002, ... and
      NFR-001, NFR-002, .... Give each requirement a Must, Should, or Could
      priority. Requirements describe observable product behavior or constraints,
      not implementation details. Keep Must scope to the minimum needed to test
      the spiral. Downstream references must qualify each ID as
      `<change-name>#<capability-path>/FR-001` or
      `<change-name>#<capability-path>/NFR-001`.

      Resolve decisions that would materially change scope or acceptance before
      completing the PRD set. Label unvalidated targets as assumptions, and do
      not promote candidate later spirals into current capability scope. Ask the
      human when requirement intent, priority, acceptance, dependencies, risks, or
      exclusions are uncertain; do not silently choose on their behalf.
    requires:
      - prd

  - id: master-prd
    generates: master-prd.md
    description: Complete proposed revision of the single enduring product PRD
    template: master-prd.md
    instruction: |
      Prepare the full proposed product document BEFORE requesting product approval.
      Resolve planningHome.root from the OpenSpec instruction/status response and
      use <planningHome.root>/docs/product/prd.md as the sole current master, including
      for stores. Never use an unrelated checkout's product document.

      When a master exists, verify its approved provenance using the Approved master
      preflight in the product-approval instructions. Start from its entire current
      content and record SHA-256 of its raw bytes in Base Master SHA-256. Record the
      exact selected change name in Revision Change. Do not edit the published master
      while drafting. If no master exists, use Base Master SHA-256: absent.

      If dated docs/product/<archive-target>/ snapshots or archived approved PRDs
      exist without a master, this is a migration, not a blank product. Read all
      relevant approved records, identify superseded or conflicting requirements,
      and reconcile them with the human. List source records and resolved decisions
      in the revision summary. Never assume the newest increment describes the whole
      product or concatenate snapshots. Existing snapshots and catalog rows remain
      historical records and must not be edited or deleted.

      Integrate the change-scoped prd.md and capability PRDs into one self-contained
      master-prd.md. Include product vision, users, evidence, outcomes, boundaries,
      detailed requirements grouped by capability, product acceptance outcomes,
      dependencies, exclusions, and open decisions. Readers must not need to assemble
      separate change PRDs to understand the current product. Use internal anchors
      for capability navigation; links to history are supporting provenance only.

      For useful user journeys and user flows, follow workflows/user-journeys.md in
      this installed schema and the fictional examples/user-journeys.md. Embed journey
      tables, Mermaid flowcharts, and text equivalents directly in master-prd.md.
      Preserve unaffected views and reconcile affected stages, decisions, outcomes,
      exclusions, and qualified requirement coverage with the reviewed increment.
      Distinguish observed experience from proposed intent and evidence from assumptions.
      Validate Mermaid syntax before review and inspect rendering when available;
      report which checks were performed. These optional views do not add artifacts
      or require older approved masters to change solely to match the new template.

      Reconcile meaning, not just text: add new capabilities, replace modified
      requirement wording, remove retired requirements from active scope, and update
      contradictory exclusions, outcomes, dependencies, and acceptance criteria.
      Preserve unaffected requirements and their priorities. Explain removals and
      replacements in the revision summary, including migration implications.
      Carry forward existing capability-qualified requirement identities unchanged;
      cite new or revised requirements with this change's qualified IDs and record
      which previous IDs they supersede. Never renumber unrelated requirements.
      Consolidation must not introduce product scope absent from approved baseline
      content or the reviewed increment; resolve ambiguity with the human.

      Distinguish approved intent from delivery. Mark new or changed requirements
      Approved / delivery pending (conditional on this draft's approval); carry
      forward delivery evidence only when verified. Unknown availability stays
      unknown. Archive or a checked task alone is not proof of deployed behavior.
      Status-only corrections also require a reviewed revision; archive never edits
      the approved master. Candidate future ideas remain explicitly unapproved.

      Show a meaningful diff against the baseline AND the complete resulting master,
      alongside the change-scoped PRDs, before asking for approval. Compute the
      complete PRD-set digest using product-approval instructions and retain it with
      the review summary; approval applies to those reviewed bytes. If the published
      master changes before approval, rebase this draft on the new approved master,
      preserve unrelated changes, resolve conflicts with the human, and repeat review.
      Never silently change Base Master SHA-256 to bypass a stale baseline.
    requires:
      - prd
      - prd-capabilities

  - id: product-approval
    generates: product-approval.md
    description: Approve the increment and exact master revision, then publish the master
    template: product-approval.md
    instruction: |
      This is a human approval gate, not a document-generation exercise. Present
      prd.md hypothesis, boundaries, and feedback loop plus every capability PRD's
      Must requirements, acceptance outcomes, assumptions, and open decisions.
      Include any embedded journey tables, Mermaid source, text equivalents, and
      requirement coverage in that review. Use workflows/user-journeys.md to check
      consistency and diagram validity; resolve material product questions first.
      Create product-approval.md only after the user explicitly approves this
      exact complete PRD set, including master-prd.md and its baseline diff, for
      engineering planning and immediate master publication. Silence, previous discovery
      answers, or a request to revise do not count.

      Tell the approver that the exact reviewed master-prd.md will become
      <planningHome.root>/docs/product/prd.md immediately upon approval, before
      implementation. It represents approved intent, including pending delivery.
      Record Approval Format: 2 and the immediate publication authorization using
      the template. Revise the draft first if it is not suitable for project users.

      Before approval, verify that prd.md's index contains every and only Markdown
      file under prd/capabilities/, with unique lowercase kebab-case paths. Compute
      the deterministic PRD-set SHA-256 as follows:
      1. Order paths as prd.md first, followed by every indexed capability file in
         bytewise lexical path order, followed by master-prd.md last.
      2. SHA-256 each file's raw bytes and write one UTF-8 manifest line per file
         as `<lowercase-file-digest><two spaces><relative-path><LF>`.
      3. SHA-256 the exact manifest bytes and record that lowercase 64-hex digest
         plus the manifest file count in product-approval.md.
      Record Master SHA-256 as SHA-256 of master-prd.md's raw bytes, and Base Master
      SHA-256 equal to that field in master-prd.md (a lowercase 64-hex digest or
      absent). The master is part of the PRD-set digest, not an unapproved rendering.
      Any content, index, path, addition, removal, or rename changes this digest
      and invalidates approval. Never record a rejected, research, or park decision
      as an approval file. Legacy approvals without format 2 do not authorize master
      publication: prepare and review the consolidated master and obtain new approval.
      Journey and flow edits are PRD content edits, including diagram-only fixes.
      Preserve approved history and obtain renewed approval before republishing;
      never render changes back into the master after approval or during archive.

      Publication transaction (required for approval completion):
      - Use only the resolved planning home and change root. Reject symlinks in
        source/destination path components and paths escaping their respective roots.
        Create docs/product/ if absent after validating its parent paths. Before any
        write, verify that the explicit approval still covers the current source bytes
        and that the README template is available if initialization is needed.
      - Serialize product publication in this planning home using an exclusive
        docs/product/.publication-lock directory (atomic creation). If it already
        exists, stop; never remove another invocation's lock. After a crash, inspect
        the recorded approval and current master before explicitly recovering it.
      - Under the lock, re-read the approved source files and revalidate all hashes.
        Require the PRD-set digest to equal the digest retained at human review,
        not merely a digest recomputed after an unnoticed edit. Re-review if it differs.
        Hash the current docs/product/prd.md or use absent if it does not exist.
        It must equal Base Master SHA-256. If it differs, stop without overwriting,
        rebase the candidate and obtain fresh approval. If it already equals Master
        SHA-256 and matches this exact approval, treat publication as an idempotent
        retry; verify provenance and repair only missing publication bookkeeping.
      - Preserve the existing master and README bytes for rollback. Stage a raw-byte
        copy of master-prd.md inside docs/product/ and verify its hash matches Master
        SHA-256. Do not reformat, rewrite links, or synthesize content after approval.
      - Create product-approval.md from the reviewed hashes and explicit human
        approval. Atomically rename the staged master to docs/product/prd.md. Create
        docs/product/README.md from templates/product-catalog.md if absent; otherwise
        add a stable link to prd.md and an explanation that dated sets are historical,
        preserving human-authored content and all existing catalog rows.
      - Verify the installed master's bytes, approval digest, file count, and README
        link. Only then report approval and PM handoff complete. On failure restore
        the previous master and README, remove only files/staging created by this
        attempt, and report approval incomplete. Release only this invocation's lock
        in success or failure. An interrupted attempt must be reconciled before any
        engineering work; file existence alone never proves publication succeeded.

      Approved master preflight (required for drafting from an existing master,
      engineering planning, apply, sync, and archive):
      - Stop while docs/product/.publication-lock exists, except inside the owning
        publication transaction. Require docs/product/README.md to link to prd.md
        and that link to resolve; interrupted bookkeeping needs publication recovery.
      - For a selected change, validate format 2, immediate publication authorization,
        the exact index/file match, PRD-set digest/count including master-prd.md,
        Master SHA-256, and agreement of both Base Master SHA-256 fields.
      - Require docs/product/prd.md to exist and be byte-identical to a master-prd.md
        with a valid format-2 approval record in the selected planning home's active
        changes, archives, or product-history snapshots. Validate that source's full
        PRD set too. Never treat an arbitrary edited master as an approved baseline.
      - If the current master differs from the selected change's approved revision,
        follow Base Master SHA-256 through those validated records to the selected
        revision. Reject missing links or cycles. A later approved descendant is
        legitimate; never republish an older master during planning or archive.
        Before engineering/apply/sync, compare this increment against current intent;
        if a later revision supersedes its scope, pause affected work and reconcile
        it through human review/reapproval. Archive may retain superseded history.
      - A missing publication, invalid provenance, or legacy approval blocks the
        operation; return to product approval for explicit migration or recovery.
        Read-only baseline validation has no selected-change requirement.

      Approval is a durable snapshot for coherent engineering work, not an
      irreversible waterfall phase. If later learning changes product intent,
      before editing any PRD-set file preserve the previous approved PRD set and
      product-approval.md byte-for-byte under the selected change's
      product-history/<PRD-set-digest>/ (outside prd/capabilities/). Verify the snapshot
      digest; reuse an existing identical snapshot and reject conflicting contents.
      Preserve a valid legacy set with its original manifest algorithm when migrating.
      Then remove the working approval, revise the increment and master together,
      obtain explicit approval of the new digest, and reconcile downstream artifacts.
      Leave the last published master and historical approval records intact during
      drafting or rejection. A withdrawal or rollback is a new approved revision of
      the current master, never a silent restoration over later approved work.
    requires:
      - prd
      - prd-capabilities
      - master-prd

  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: |
      Create the OpenSpec engineering handoff from the approved PRD set. Do not
      reopen product scope or add features absent from the owning PRD and indexed
      capability PRDs.

      This proposal starts the development handoff. Translate approved product
      intent into OpenSpec capability work without copying the PRD wholesale.
      Product capability paths and spec capability paths may differ.

      Run the Approved master preflight in the product-approval instructions, including
      published provenance and superseded-scope checks. The master is product context;
      only the change-scoped PRDs define this increment's engineering work.
      Before writing, validate the exact index/file match and recompute the PRD-set
      digest using the manifest algorithm in the product-approval instructions.
      Compare the digest and file count with product-approval.md. If either differs,
      stop and obtain fresh product-owner approval; do not create or update
      engineering artifacts from a stale approval.

      Sections:
      - **Why**: 1-2 sentences on the problem or opportunity. What problem does this solve? Why now?
      - **What Changes**: Bullet list of changes. Be specific about new capabilities, modifications, or removals. Mark breaking changes with **BREAKING**.
      - **Capabilities**: Identify which specs will be created or modified:
        - **New Capabilities**: List capabilities being introduced. Each becomes a new `specs/<capability-path>/spec.md`. Use kebab-case for path segments you introduce (e.g., `user-auth` or `identity/user-auth`) and follow the project's existing spec organization.
        - **Modified Capabilities**: List existing capabilities whose REQUIREMENTS are changing. Only include if spec-level behavior changes (not just implementation details). Each needs a delta spec file. Use the exact existing path under `openspec/specs/`. Leave empty if no requirement changes.
      - **Impact**: Affected code, APIs, dependencies, or systems.

      IMPORTANT: The Capabilities section is critical. It creates the contract between
      proposal and specs phases. Research existing specs before filling this in.
      Each capability listed here will need a corresponding spec file.

      Every change must either declare at least one capability (new or
      modified) or explicitly opt out of specs: `openspec validate` rejects a
      change with zero deltas unless the change's `.openspec.yaml` sets
      `skip_specs: true`. Use `skip_specs: true` only when no spec-level
      behavior changes (pure refactor, tooling, docs) - specs describe
      behavior, so if behavior does not change, no spec should change either.
      The change-scoped prd.md and indexed capability PRDs must also contain zero
      Must requirements; otherwise their mandatory OpenSpec traceability requires
      specs. Unaffected Must requirements carried forward in master-prd.md do not
      block a documentation-only consolidation. Do not invent a requirement just
      to satisfy validation.

      Keep it concise (1-2 pages). Focus on the "why" not the "how" -
      implementation details belong in design.md.

      In each OpenSpec capability description, cite the capability PRD requirement
      IDs it delivers, qualified as
      `<change-name>#<capability-path>/FR-001` or
      `<change-name>#<capability-path>/NFR-001` so references remain unambiguous
      after archive. Product capabilities and OpenSpec spec capabilities may map
      many-to-many; do not assume matching paths.
      The PRD set remains the source of product intent and priority; this proposal
      translates its selected spiral into OpenSpec capabilities.

      If proposal work exposes a product ambiguity or missing requirement, stop
      only the affected work, return to the PRD set for human clarification and
      reapproval, then continue. Do not hide the discovery or force the entire
      change to restart.
    requires:
      - product-approval
      - prd
      - prd-capabilities
      - master-prd

  - id: specs
    generates: "specs/**/*.md"
    description: Detailed specifications for the change
    template: spec.md
    instruction: |
      Create specification files that define WHAT the system should do.

      Run the Approved master preflight in the product-approval instructions, including
      published provenance and superseded-scope checks. Do not create delta specs for
      unaffected requirements merely carried forward in the master.
      Before writing, validate the exact PRD index/file match and recompute the
      PRD-set digest using the manifest algorithm in the product-approval
      instructions. Compare the digest and file count with product-approval.md.
      Stop for renewed approval if either differs.

      A spec is a behavior contract, not an implementation plan.

      Good spec content:
      - Observable behavior users or downstream systems rely on
      - Inputs, outputs, and error conditions
      - External constraints (security, privacy, reliability, compatibility)
      - Scenarios that can be tested or explicitly validated

      Avoid in specs:
      - Internal class/function names
      - Library or framework choices
      - Step-by-step implementation details
      - Detailed execution plans (those belong in design.md or tasks.md)

      Quick test: if the implementation can change without changing externally
      visible behavior, it likely does not belong in the spec.

      Create one spec file per capability listed in the proposal's Capabilities section.
      `<capability-path>` is the spec directory relative to `specs/` (for example,
      `user-auth` or `identity/user-auth`). Preserve the full path:
      - New capabilities: use the exact path from the proposal at `specs/<capability-path>/spec.md`. Any path segment newly introduced in the proposal must be kebab-case. Follow the project's existing organization; do not add a new domain level when the project uses a flat layout.
      - Modified capabilities: use the exact existing path from `openspec/specs/<capability-path>/` when creating the delta at `specs/<capability-path>/spec.md`. Do not move or rename the capability.

      There must be at least one spec file unless the change's `.openspec.yaml`
      sets `skip_specs: true` (no spec-level behavior change) - `openspec validate`
      rejects a zero-delta change without that marker. If the proposal lists no
      capabilities and `skip_specs` is not set, revisit the proposal first. Never
      use `skip_specs` when any indexed capability PRD contains a Must requirement;
      every Must requires an OpenSpec requirement mapping.

      Delta operations (use ## headers):
      - **ADDED Requirements**: New capabilities
      - **MODIFIED Requirements**: Changed behavior - MUST include full updated content
      - **REMOVED Requirements**: Deprecated features - MUST include **Reason** and **Migration**
      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format

      Format requirements:
      - Each requirement: `### Requirement: <name>` followed by description
      - Use SHALL/MUST for normative requirements (avoid should/may)
      - Each scenario: `#### Scenario: <name>` with WHEN/THEN format
      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (`####`). Using 3 hashtags or bullets will fail silently.
      - Every requirement MUST have at least one scenario.

      New capabilities only: start the delta spec with a `## Purpose` section -
      one or two sentences (50+ characters, or `openspec validate --strict`
      reports it as too brief) describing what the capability is for. Archive
      copies it into the main spec it creates; without it the new main spec is
      left with a `TBD ... Update Purpose after archive` placeholder to fill in
      by hand. Do NOT add `## Purpose` to a delta for an existing capability -
      that spec already has one and the delta's is ignored. To change an
      existing capability's Purpose - including a leftover `TBD` placeholder -
      edit `<planningHome.root>/openspec/specs/<capability-path>/spec.md`
      directly. `planningHome.root` comes from the `openspec instructions ...
      --json` response. Always use it rather than a repo-relative path: it
      resolves to the store whenever the change lives in one - whether that
      came from `--store`, a project `store:` pointer, or a global default
      store - and to the current repository otherwise. Do not try to work out
      which case applies; the field already has.

      MODIFIED requirements workflow:
      1. Locate the existing requirement in `<planningHome.root>/openspec/specs/<capability-path>/spec.md` (the same store-aware root as above)
      2. Copy the ENTIRE requirement block (from `### Requirement:` through all scenarios)
      3. Paste under `## MODIFIED Requirements` and edit to reflect new behavior
      4. Ensure header text matches exactly (whitespace-insensitive)

      Common pitfall: Using MODIFIED with partial content loses detail at archive time.
      If adding new concerns without changing existing behavior, use ADDED instead.

      Example (a new capability, so it opens with `## Purpose`):
      ```
      ## Purpose

      Lets users take their data out of the product in a portable format.

      ## ADDED Requirements

      ### Requirement: User can export data
      The system SHALL allow users to export their data in CSV format.

      #### Scenario: Successful export
      - **WHEN** user clicks "Export" button
      - **THEN** system downloads a CSV file with all user data

      ## REMOVED Requirements

      ### Requirement: Legacy export
      **Reason**: Replaced by new export system
      **Migration**: Use new export endpoint at /api/v2/export
      ```

      Specs should be testable - each scenario is a potential test case. Add a
      `**PRD Traceability:**` line to each requirement with qualified references
      such as `<change-name>#<capability-path>/FR-001`. Every Must requirement in
      every indexed capability PRD must map to at least one OpenSpec requirement.
      If it cannot, revise and reapprove the PRD set before writing specs;
      engineering planning cannot silently drop it. Capability PRDs define product
      intent and priority; these specs define normative behavior and test scenarios.
      If specification work reveals a product decision, route it back to the human
      and approved PRD set instead of inventing product intent in the spec.
    requires:
      - proposal
      - product-approval
      - prd
      - prd-capabilities
      - master-prd

  - id: design
    generates: design.md
    description: Technical design document with implementation details
    template: design.md
    instruction: |
      Create the design document that explains HOW to implement the change.

      Run the Approved master preflight in the product-approval instructions, including
      published provenance and superseded-scope checks.
      Before writing, validate the exact PRD index/file match and recompute the
      PRD-set digest using the manifest algorithm in the product-approval
      instructions. Compare the digest and file count with product-approval.md.
      Stop for renewed approval if either differs.

      Always create design.md because tasks depend on it. For a simple change,
      keep it brief and state when no significant design decision or migration
      is needed.

      Sections:
      - **Context**: Only the current state and constraints needed to explain the approach. Reference the proposal for motivation instead of restating it (e.g., "See proposal.md - Why").
      - **Goals / Non-Goals**: What this design achieves and explicitly excludes. Don't restate the proposal's scope - add only design-level boundaries.
      - **Decisions**: Key technical choices with rationale (why X over Y?). Include alternatives considered for each decision.
      - **Risks / Trade-offs**: Known limitations, things that could go wrong. Format: [Risk] → Mitigation
      - **Migration Plan**: Steps to deploy, rollback strategy (if applicable)
      - **Open Questions**: Unknowns that can safely be answered later without
        changing the specs, the approach, or the task breakdown. Omit if none.

      Open questions are for genuinely deferrable unknowns, not decisions you
      skipped. If a question would change the specs, the chosen approach, or
      the task breakdown, resolve it now - ask the user instead of guessing.

      Focus on architecture and approach, not line-by-line implementation.
      The proposal covers why and what; design covers how. Reference the
      proposal for motivation and, once written, the specs for requirements -
      if a section would only restate them, point to them instead.

      Good design docs explain the "why" behind technical decisions. Preserve
      the PRD set's product and operational constraints, and do not use design
      choices to expand the approved spiral.

      If design work exposes a product decision or changes product intent,
      acceptance, or priority, stop only the affected work. Return to the human,
      preserve the prior approved set using the product-approval history procedure,
      remove working approval, revise and reapprove the PRD set, then reconcile the
      affected proposal, specs, design, and tasks before continuing.
    requires:
      - proposal
      - product-approval
      - prd
      - prd-capabilities
      - master-prd

  - id: tasks
    generates: tasks.md
    description: Implementation checklist with trackable tasks
    template: tasks.md
    instruction: |
      Create the task list that breaks down the implementation work.

      Run the Approved master preflight in the product-approval instructions, including
      published provenance and superseded-scope checks. Scope tasks to this increment,
      not every requirement carried forward in the master.
      Before writing, validate the exact PRD index/file match and recompute the
      PRD-set digest using the manifest algorithm in the product-approval
      instructions. Compare the digest and file count with product-approval.md.
      Stop for renewed approval if either differs.

      Before writing tasks, check design.md for Open Questions. If any of them
      would change what gets built, resolve them with the user first - do not
      bake an unstated assumption into the task list.

      **IMPORTANT: Follow the template below exactly.** The apply phase parses
      checkbox format to track progress. Tasks not using `- [ ]` won't be tracked.

      Guidelines:
      - Group related tasks under ## numbered headings
      - Each task MUST be a checkbox: `- [ ] X.Y Task description`
      - Tasks should be small enough to complete in one session
      - Order tasks by dependency (what must be done first?)
      - Each task MUST state how to verify completion (a test, command,
        observable behavior, or delivered artifact). Put the verification in
        that task's checkbox description. Use a separate verification task only
        when it checks broader integration or system behavior that spans
        multiple implementation tasks.

      Example:
      ```
      ## 1. Setup

      - [ ] 1.1 Create new module structure and verify expected files are present
      - [ ] 1.2 Add dependencies to package.json and verify package installation succeeds

      ## 2. Core Implementation

      - [ ] 2.1 Implement data export function and verify the export test passes
      - [ ] 2.2 Add CSV formatting utilities and verify unit tests cover quoting and delimiters
      ```

      Reference specs for what needs to be built, design for how to build it.
      Ensure the task set covers every Must requirement in every indexed capability
      PRD and includes the feedback or measurement work needed to close this
      product spiral. Include capability-qualified PRD IDs and relevant spec
      requirement names in each task description.

      The resulting tasks are the implementation handoff. Keep them aligned with
      the approved PRD set and normative specs; do not turn candidate future
      spirals into current implementation work.

      If task planning reveals missing product intent or a changed acceptance
      outcome, stop only the affected planning. Return to the human, preserve the
      previous approved set using the product-approval history procedure, remove
      working approval, revise and reapprove the PRD set, then reconcile affected
      engineering artifacts before completing the implementation handoff.
    requires:
      - specs
      - design
      - product-approval
      - prd
      - prd-capabilities
      - master-prd

apply:
  requires: [ tasks ]
  tracks: tasks.md
  instruction: |
    Run the Approved master preflight in the product-approval instructions, including
    published provenance and superseded-scope checks.
    Before implementation, validate the exact PRD index/file match and recompute
    the PRD-set digest using the manifest algorithm in the product-approval
    instructions. Compare the digest and file count with product-approval.md.
    Pause for renewed product-owner approval if either differs. This preflight is
    required even when task status is blocked or all_done.
    Read context files, work through pending tasks, mark complete as you go.
    Pause if you hit blockers or need clarification. If implementation feedback
    changes product intent or acceptance, update and reapprove the PRD set, then
    reconcile proposal, specs, design, and tasks before continuing. This feedback
    loop is expected; do not silently expand scope or force a new change merely
    because implementation has started.
